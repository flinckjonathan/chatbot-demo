# Cloudflare Pages project. Static files come from public/, the API from
# functions/. Create the KV namespace once with
#   npx wrangler kv namespace create DEMO_KV
# and paste the returned id below. Local dev uses a simulated KV store.
name = "chatbot-demo"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

[[kv_namespaces]]
binding = "DEMO_KV"
id = "83b39cb0853b4269888268d169aae3fe"

# The message caps default to 6 per visitor and 50 for the whole demo per
# day (src/guard/rateLimit.ts). To change them without touching code, set
# plain-text variables here or in the Pages dashboard:
# [vars]
# RATE_PER_VISITOR = "6"
# RATE_PER_DAY = "50"
# The code caps them at 50 and 1000 (MAX_CONFIGURED_* in rateLimit.ts).
